<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kontakt LoremCo</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">forside</a></li>
                <li><a href="shop.html">shop</a></li>
                <li><a href="about.html">om os</a></li>
                <li><a href="contact.html">kontakt</a></li>
            </ul>
        </nav>
    </header>
    <main class="" id="">
        <section class="" id="">
            <form action="" class="contact-form contact--shadow" id="form" novalidate>
                <div id="errors"></div>
                <div class="column2">
                    <fieldset class="form__fieldset">
                        <label for="">Full Name</label>
                        <input type="text" required name="fullName" class="form__input" placeholder="john david">
                    </fieldset>
                    <fieldset class="form__fieldset">
                        <label for="">Your Email</label>
                        <input type="email" name="email" id="" required class="form__input"
                            placeholder="example@yourmail.com">
                    </fieldset>
                    <fieldset class="form__fieldset">
                        <label for="">Company</label>
                        <input type="text" required name="company" class="form__input"
                            placeholder="yourcompany name here">
                    </fieldset>
                    <!-- <fieldset class="form__fieldset">
                            <label for="">Phone</label>
                            <input type="text" required name="phone" class="form__input">
                        </fieldset> -->
                    <fieldset class="form__fieldset">
                        <label for="">Subject</label>
                        <input type="text" required name="subject" class="form__input" placeholder="how can we help">
                    </fieldset>

                </div>
                <fieldset class="form__fieldset">
                    <label for="">Message</label>
                    <textarea required name="message" class="form__input input__message"
                        placeholder="Hello there,I would like to talk about how to..."></textarea>
                </fieldset>
                <fieldset style="text-align: center;" class="form__fieldset">
                    <input style="width:auto" type="submit" value="Send Message">
                </fieldset>
            </form>
        </section>
    </main>
    <footer><small>LoremCo &copy; 2026</small></footer>
</body>

</html>
